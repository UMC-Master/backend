name: deploy-develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_USER: ec2-user
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -ex
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          cat >>~/.ssh/config <<END
          Host homemaster
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          END

      - name: Copy Workspace
        run: |
          echo "Copying workspace..."
          ssh homemaster 'mkdir -p /home/ec2-user/backend'
          rsync -avz --delete --exclude='node_modules' --exclude='.git' --exclude='.env' ./ homemaster:/home/ec2-user/backend
          echo "Workspace copied."

       - name: Build
        run: |
          echo "Building project..."
          ssh homemaster 'cd /home/ec2-user/backend && npm run build'
          echo "Build complete."

      - name: Run Prisma Migrations
        run: |
          echo "Running Prisma migrations..."
          ssh homemaster 'cd /home/ec2-user/backend && npx prisma migrate deploy'
          echo "Prisma migrations complete."

      - name: Generate Prisma Client
        run: |
          echo "Generating Prisma client..."
          ssh homemaster 'cd /home/ec2-user/backend && npx prisma generate'
          echo "Prisma client generated."

      - name: Restart App with PM2
        run: |
          echo "Restarting app..."
          ssh homemaster '
            cd /home/ec2-user/backend
            pm2 describe homemaster-api > /dev/null 2>&1 && pm2 restart homemaster-api || pm2 start npm --name "homemaster-api" -- run start
            pm2 save
          '
          echo "App restarted."
